<title>Skyward Minis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Skyward Minis UI — chunky "toy" panels from the UI kit: indigo glass panels with
   dark outlines, gold primary buttons, white display type with ink strokes.
   Layout: one 16:9 stage, letterboxed; UI authored at 1280x720 and scaled. */
:root {
  --ink: #2b2540;
  --night: #1c1633;
  --indigo: #3a2a5e;
  --panel-top: #5c4cc6;
  --panel-bot: #3b2e8c;
  --violet: #6a4ab3;
  --orchid: #c57cff;
  --rose: #ff6eb4;
  --lilac: #e4d9ff;
  --gold: #ffd45c;
  --gold-deep: #f2a92a;
  --sky: #7fb2ff;
  --hp: #6fe58a;
  --foe: #ff5c7a;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}

html,
body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: #fff;
}
body {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  box-sizing: border-box;
  overflow: hidden;
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: radial-gradient(ellipse at 50% 40%, #3a2a6e 0%, var(--night) 70%);
}
.stage {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  max-width: 100%;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.stage canvas {
  display: block;
}
.rotate-hint {
  display: none;
  font: 700 14px/1.3 var(--font-body);
  color: var(--lilac);
  text-align: center;
}
#app.portrait .rotate-hint {
  display: block;
}
.loading {
  font: 24px var(--font-display);
  color: var(--lilac);
}

.ui-root {
  position: absolute;
  left: 0;
  top: 0;
  width: 1280px;
  height: 720px;
  transform-origin: 0 0;
  pointer-events: none;
  font-family: var(--font-body);
  font-weight: 700;
  transition: opacity 0.16s ease;
}
.ui-root.fading {
  opacity: 0;
}
.ui-root button,
.ui-root .panel,
.ui-root .hero-panel,
.ui-root .pause-veil,
.ui-root .result {
  pointer-events: auto;
}
.screen {
  position: absolute;
  inset: 0;
}
.ico {
  display: inline-flex;
  width: 1em;
  height: 1em;
}
.ico svg {
  width: 100%;
  height: 100%;
}
[hidden] {
  display: none !important;
}

/* ---------- shared components ---------- */
.stroke,
.btn,
.hero-name,
.ui-root h1,
.vs-word,
.round-banner,
.ribbon,
.pop {
  -webkit-text-stroke: 6px var(--ink);
  paint-order: stroke fill;
}
.panel {
  background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bot) 100%);
  border: 3px solid var(--ink);
  border-radius: 18px;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.28), inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 4px 0 rgba(28, 22, 51, 0.6);
}
.btn {
  font-family: var(--font-display);
  font-size: 30px;
  letter-spacing: 0.5px;
  color: #fff;
  border: 3px solid var(--ink);
  border-radius: 20px;
  padding: 10px 26px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.55), inset 0 -6px 0 rgba(0, 0, 0, 0.16), 0 6px 0 var(--ink);
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
}
.btn:hover {
  filter: brightness(1.06);
}
.btn:active {
  transform: translateY(4px);
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.55), inset 0 -6px 0 rgba(0, 0, 0, 0.16), 0 2px 0 var(--ink);
}
.btn:focus-visible,
.btn-round:focus-visible,
.pill:focus-visible,
.tab:focus-visible,
.skill-btn:focus-visible,
.nav-btn:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}
.btn .ico {
  font-size: 40px;
}
.btn.small {
  font-size: 22px;
  padding: 8px 14px 10px;
  border-radius: 14px;
}
.btn-gold {
  background: linear-gradient(180deg, #ffe680 0%, #ffcc3d 55%, var(--gold-deep) 100%);
}
.btn-purple {
  background: linear-gradient(180deg, #c6a2ff 0%, #9466f0 55%, #7448d8 100%);
}
.btn-purple.active {
  background: linear-gradient(180deg, #ffe680 0%, #ffcc3d 55%, var(--gold-deep) 100%);
}
.btn-plain {
  background: linear-gradient(180deg, #f1edff 0%, #c9bff2 100%);
  color: var(--ink);
  -webkit-text-stroke: 0;
}
.btn-round {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: linear-gradient(180deg, #8f7cf6 0%, #5a43c7 100%);
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.4), 0 4px 0 var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  color: #fff;
  padding: 0;
}
.btn-round .ico {
  font-size: 30px;
}
.btn-round.small {
  width: 54px;
  height: 54px;
}
.btn-round b {
  font: 20px var(--font-display);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}
.btn-round.active {
  background: linear-gradient(180deg, #ffe680 0%, var(--gold-deep) 100%);
}
.btn-round:active {
  transform: translateY(3px);
}
.back {
  position: absolute;
  top: 18px;
  left: 18px;
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px 4px 6px;
  border-radius: 999px;
  background: rgba(28, 22, 51, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.18);
  font-size: 16px;
}
.chip .ico {
  font-size: 24px;
}
.chip.rarity {
  padding-left: 12px;
  color: var(--gold);
}
.eyebrow {
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--lilac);
  opacity: 0.85;
}
.hero-plate .eyebrow {
  color: var(--ink);
  opacity: 0.7;
}
.toast {
  position: absolute;
  left: 50%;
  bottom: 150px;
  transform: translateX(-50%);
  background: rgba(28, 22, 51, 0.88);
  border: 2px solid var(--orchid);
  border-radius: 14px;
  padding: 10px 18px;
  font-size: 18px;
  transition: opacity 0.4s ease;
}
.toast.out {
  opacity: 0;
}

/* ---------- home ---------- */
.topbar {
  position: absolute;
  top: 16px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.player-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 22px 6px 6px;
  border-radius: 999px;
}
.avatar {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  background: radial-gradient(circle at 50% 35%, #8e7bff, #3b2e8c);
  object-fit: cover;
}
.pname {
  font: 24px var(--font-display);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}
.plevel {
  font-size: 15px;
  color: var(--gold);
}
.resources {
  display: flex;
  gap: 10px;
}
.res {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px 6px 8px;
  min-width: 132px;
  border-radius: 999px;
  font: 22px var(--font-display);
  font-variant-numeric: tabular-nums;
}
.res .ico {
  font-size: 34px;
}
.hero-plate {
  position: absolute;
  right: 56px;
  top: 128px;
  width: 400px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-shadow: 0 2px 0 rgba(28, 22, 51, 0.4);
}
.hero-name {
  font: 92px/0.95 var(--font-display);
  -webkit-text-stroke: 10px var(--ink);
  color: #fff;
}
.hero-title {
  font: 30px var(--font-display);
  color: var(--rose);
  -webkit-text-stroke: 5px var(--ink);
  paint-order: stroke fill;
}
.blurb {
  margin: 4px 0 0;
  font-size: 18px;
  line-height: 1.4;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.72);
  border-radius: 14px;
  padding: 10px 14px;
  text-shadow: none;
}
.tap-hint {
  font-size: 15px;
  color: var(--ink);
  opacity: 0.75;
  text-shadow: none;
}
.bottom-nav {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.nav-btn {
  position: relative;
  width: 104px;
  height: 92px;
  border-radius: 18px;
  border: 3px solid var(--ink);
  background: linear-gradient(180deg, #7d6af0 0%, #4a39a8 100%);
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), 0 5px 0 var(--ink);
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font: 18px var(--font-display);
}
.nav-btn span {
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}
.nav-btn .ico {
  font-size: 46px;
}
.nav-btn.active {
  background: linear-gradient(180deg, #ffe680 0%, var(--gold-deep) 100%);
}
.nav-btn.locked {
  filter: saturate(0.6);
}
.nav-btn .lock {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 26px;
  height: 26px;
}
.battle-btn {
  width: 240px;
  height: 118px;
  flex-direction: column;
  gap: 0;
  font-size: 40px;
  border-radius: 24px;
  padding: 4px;
}
.battle-btn .ico {
  font-size: 48px;
}
.battle-btn small {
  font-size: 16px;
  -webkit-text-stroke: 3px var(--ink);
}

/* ---------- studio ---------- */
.view-bar {
  position: absolute;
  left: 20px;
  bottom: 20px;
  display: flex;
  gap: 6px;
  padding: 8px;
  border-radius: 999px;
}
.pill {
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  font: 18px var(--font-display);
  padding: 6px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pill .ico {
  font-size: 18px;
}
.pill.active {
  background: var(--gold);
  color: var(--ink);
}
.drag-hint {
  position: absolute;
  left: 290px;
  top: 30px;
  font-size: 15px;
  color: var(--lilac);
  opacity: 0.8;
}
.hero-panel {
  position: absolute;
  right: 18px;
  top: 18px;
  bottom: 18px;
  width: 486px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-sizing: border-box;
}
.hero-panel header {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-panel h1 {
  margin: 0;
  font: 62px/1 var(--font-display);
  -webkit-text-stroke: 8px var(--ink);
}
.hero-panel .hero-title {
  font-size: 24px;
}
.hero-panel .stars .ico {
  font-size: 26px;
}
.stat-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.stat {
  background: rgba(28, 22, 51, 0.45);
  border-radius: 12px;
  padding: 6px 4px;
  text-align: center;
  display: flex;
  flex-direction: column;
}
.stat small {
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--lilac);
}
.stat b {
  font: 24px var(--font-display);
  font-variant-numeric: tabular-nums;
}
.tabs {
  display: flex;
  gap: 6px;
  background: rgba(28, 22, 51, 0.45);
  border-radius: 14px;
  padding: 5px;
}
.tab {
  flex: 1;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--lilac);
  font: 19px var(--font-display);
  padding: 8px 0;
  cursor: pointer;
}
.tab.active {
  background: var(--gold);
  color: var(--ink);
}
.tab-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 4px;
}
.hint {
  margin: 0;
  font-size: 15px;
  line-height: 1.4;
  color: var(--lilac);
}
.grid-btns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.faces {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.face-chip {
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: radial-gradient(circle at 50% 30%, #9a86ff, #4a39a8);
  padding: 4px 4px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
  font: 15px var(--font-display);
}
.face-chip img {
  width: 92px;
  height: 92px;
  object-fit: cover;
}
.face-chip:active {
  transform: translateY(2px);
}
.skill-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: rgba(28, 22, 51, 0.45);
  border-radius: 14px;
  padding: 10px 12px;
}
.skill-ico {
  flex: none;
  width: 58px;
  height: 58px;
  border-radius: 14px;
  border: 3px solid var(--ink);
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 55%, white), var(--c));
  display: grid;
  place-items: center;
}
.skill-ico .ico {
  font-size: 40px;
}
.skill-txt {
  min-width: 0;
}
.skill-head {
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}
.skill-head b {
  font: 21px var(--font-display);
}
.tag {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold);
}
.skill-txt p {
  margin: 4px 0 0;
  font-size: 15px;
  line-height: 1.4;
  color: var(--lilac);
}
.specs {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
}
.specs th {
  text-align: left;
  color: var(--lilac);
  font-weight: 700;
  padding: 6px 8px;
  width: 38%;
}
.specs td {
  padding: 6px 8px;
  font-variant-numeric: tabular-nums;
}
.specs tr:nth-child(odd) {
  background: rgba(28, 22, 51, 0.4);
}
.swatches {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.swatch i {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid var(--ink);
}
.swatch small {
  font-size: 10px;
  color: var(--lilac);
}

/* ---------- battle ---------- */
.world-host,
.world-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.unit-bar {
  position: absolute;
  left: 0;
  top: 0;
  width: 74px;
  margin-left: -37px;
  margin-top: -14px;
}
.unit-bar .hp {
  position: relative;
  height: 10px;
  border-radius: 6px;
  background: rgba(28, 22, 51, 0.85);
  border: 2px solid var(--ink);
  overflow: hidden;
}
.unit-bar .hp i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 4px;
}
.unit-bar .fill {
  background: linear-gradient(180deg, #9cf5ac, var(--hp));
  transition: width 0.15s ease;
}
.unit-bar.enemy .fill {
  background: linear-gradient(180deg, #ff9aac, var(--foe));
}
.unit-bar .fill.low {
  background: linear-gradient(180deg, #ffd27a, #ff9a3d);
}
.unit-bar .lag {
  background: #fff;
  opacity: 0.7;
  transition: width 0.6s ease 0.25s;
}
.unit-bar .energy {
  height: 6px;
  margin: 2px 6px 0;
  border-radius: 4px;
  border: 2px solid var(--ink);
  background: rgba(28, 22, 51, 0.85);
  overflow: hidden;
}
.unit-bar .en-fill {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--orchid), var(--rose));
  transition: width 0.2s ease;
}
.unit-bar.dead {
  opacity: 0;
  transition: opacity 0.5s ease 0.6s;
}
.pop {
  position: absolute;
  transform: translate(-50%, -100%);
  font: 30px var(--font-display);
  color: #fff;
  -webkit-text-stroke: 6px var(--ink);
  animation: pop 1.1s ease-out forwards;
  white-space: nowrap;
}
.pop.dmg {
  color: #fff;
}
.pop.hurt {
  color: #ffb3c1;
}
.pop.crit {
  color: var(--gold);
  font-size: 40px;
}
.pop.heal {
  color: #8dffb0;
}
@keyframes pop {
  0% {
    transform: translate(-50%, -60%) scale(0.4);
    opacity: 0;
  }
  15% {
    transform: translate(-50%, -110%) scale(1.15);
    opacity: 1;
  }
  30% {
    transform: translate(-50%, -110%) scale(1);
  }
  100% {
    transform: translate(-50%, -190%) scale(0.95);
    opacity: 0;
  }
}
.vs-bar {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
}
.team {
  display: flex;
  align-items: center;
  gap: 8px;
}
.team img {
  width: 62px;
  height: 62px;
  border-radius: 14px;
  border: 3px solid var(--ink);
  background: radial-gradient(circle at 50% 35%, #8e7bff, #3b2e8c);
  object-fit: cover;
}
.team.foe img {
  background: radial-gradient(circle at 50% 35%, #ff9aac, #7a2a4a);
}
.team .tb {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 220px;
}
.team.foe .tb {
  align-items: flex-end;
}
.team .tb span {
  font: 19px var(--font-display);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
}
.team .bar {
  width: 100%;
  height: 16px;
  border-radius: 8px;
  border: 3px solid var(--ink);
  background: rgba(28, 22, 51, 0.85);
  overflow: hidden;
}
.team .bar i {
  display: block;
  height: 100%;
  width: 100%;
  background: linear-gradient(180deg, #9cc6ff, #4f7dff);
  transition: width 0.3s ease;
}
.team.foe .bar {
  display: flex;
  justify-content: flex-end;
}
.team.foe .bar i {
  background: linear-gradient(180deg, #ff9aac, var(--foe));
}
.vs {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 120px;
}
.vs-word {
  font: 48px/1 var(--font-display);
  color: var(--gold);
  -webkit-text-stroke: 7px var(--ink);
}
.round {
  margin-top: 2px;
  font-size: 15px;
  background: rgba(28, 22, 51, 0.7);
  border-radius: 999px;
  padding: 2px 12px;
  font-variant-numeric: tabular-nums;
}
.speed-ctrls {
  position: absolute;
  top: 18px;
  right: 18px;
  display: flex;
  gap: 8px;
}
.btn-round.auto b {
  font-size: 16px;
}
.deploy-bar {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
}
.deploy-tip {
  padding: 12px 18px;
  font-size: 17px;
  max-width: 470px;
  line-height: 1.35;
}
.deploy-tip b {
  font-family: var(--font-display);
  font-weight: 400;
  color: var(--gold);
  margin-right: 6px;
}
.fight-btn {
  font-size: 40px;
  padding: 10px 36px 14px;
}
.hero-card {
  position: absolute;
  left: 18px;
  bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 8px 8px;
